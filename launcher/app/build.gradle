plugins {
    id 'com.android.application'
}

android {
    namespace 'be.philips.cleanhome'
    compileSdk 34

    defaultConfig {
        applicationId 'be.philips.cleanhome'
        minSdk 26
        targetSdk 29
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
