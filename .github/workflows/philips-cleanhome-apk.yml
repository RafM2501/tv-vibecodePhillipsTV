name: Philips Clean Home APK

on:
  push:
    branches: [philips-clean-home]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Build debug APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: philips-clean-home-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
