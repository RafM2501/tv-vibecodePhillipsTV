name: Philips Clean Home APK

on:
  push:
    branches: [philips-clean-home]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - name: Build release APK
        working-directory: launcher
        env:
          PHILIPS_KEYSTORE_BASE64: ${{ secrets.PHILIPS_KEYSTORE_BASE64 }}
          PHILIPS_SIGNING_PASSWORD: ${{ secrets.PHILIPS_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ -n "$PHILIPS_KEYSTORE_BASE64" && -n "$PHILIPS_SIGNING_PASSWORD" ]]; then
            export PHILIPS_KEYSTORE_PATH="$RUNNER_TEMP/philips-clean-home.p12"
            printf '%s' "$PHILIPS_KEYSTORE_BASE64" | base64 --decode > "$PHILIPS_KEYSTORE_PATH"
            chmod 600 "$PHILIPS_KEYSTORE_PATH"
            ./gradlew --no-daemon assembleRelease
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
            echo "SIGNED_APK_READY=true" >> "$GITHUB_ENV"
            echo "::notice title=Signed APK ready::Stable-signed release available as artifact"
          else
            ./gradlew --no-daemon assembleRelease
            echo "::notice title=Signing setup required::Configure both GitHub Actions secrets. Unsigned APK is NOT published."
          fi
      - name: Publish stable-signed APK
        if: env.SIGNED_APK_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: philips-clean-home-STABLE-signed-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
